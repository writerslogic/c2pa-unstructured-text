[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "c2pa-unstructured-text"
description = "C2PA manifest embedding and hard binding for unstructured text using Unicode variation selectors"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
keywords = ["c2pa", "provenance", "text", "unicode", "variation-selector"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing",
    "Topic :: Security",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/writerslogic/c2pa-unstructured-text"

[tool.maturin]
features = ["python"]
module-name = "c2pa_unstructured_text"
